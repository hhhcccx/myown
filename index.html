<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>我们</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="memory-book" aria-label="情侣纪念相册">
      <section class="chapter cover" id="cover" aria-label="封面">
        <div class="journal-page cover-card">
          <span class="doodle tape tape-left" aria-hidden="true"></span>
          <span class="doodle tape tape-right" aria-hidden="true"></span>
          <span class="doodle heart heart-one" aria-hidden="true"></span>
          <span class="doodle heart heart-two" aria-hidden="true"></span>
          <span class="doodle sparkle sparkle-one" aria-hidden="true"></span>
          <span class="doodle sparkle sparkle-two" aria-hidden="true"></span>
          <p class="journal-kicker">Love diary</p>
          <h1 class="cover-mark">我们</h1>
          <p class="journal-note">一本慢慢翻开的恋爱手账</p>
        </div>
      </section>

      <section class="chapter photo-page" id="page-01" style="--i: 1">
        <figure class="album-sheet">
          <img src="./assets/photos/page-01.jpg" alt="相册页 1" />
        </figure>
      </section>

        <figure class="album-sheet">

          <span class="doodle tape tape-right" aria-hidden="true"></span>
          <span class="doodle heart heart-one" aria-hidden="true"></span>
          <span class="doodle sparkle sparkle-one" aria-hidden="true"></span>
